apiVersion: apps/v1
kind: Deployment
metadata:
  name: rust-log-generator
  labels:
    app.kubernetes.io/name: rust-log-generator
spec:
  replicas: 1
  # One writer per volume: the old pod must be gone before the new one starts,
  # otherwise both would append to the same log file.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rust-log-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rust-log-generator
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        # The image runs as 65532:65532. fsGroup keeps the volume writable for
        # it on storage that does not hand out world-writable directories.
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: rust-log-generator
          # rust-log-generator 0.1.3, pinned by digest: a tag can be moved to a
          # different build, a digest cannot. Update it when a new image is
          # pushed.
          image: registry.gitlab.com/kubeantony/rust-log-generator@sha256:ca591f5cd1975fc599d6aa9d743d636ce6cb8d8965b3e19502ff871a73157a69
          envFrom:
            - configMapRef:
                name: rust-log-generator-config
          env:
            # Cap on LOG_MAX_FILE_MIB x LOG_MAX_FILES; the program refuses to
            # start above it. It sits just under the size of the PVC and is set
            # here, not in the ConfigMap, because `env` wins over `envFrom`:
            # changing the ConfigMap alone cannot raise it. Not every storage
            # class enforces the PVC size, so this is what keeps the log files
            # from filling the node's disk.
            - name: LOG_MAX_TOTAL_MIB
              value: "900"
          volumeMounts:
            - name: logs
              mountPath: /logs
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              memory: 128Mi
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: rust-log-generator-logs
