apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rust-log-generator

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: pss-restricted-patch.yaml

# Production runs one exact image: the tag used in the base can be moved to a
# different build, a digest cannot. Update it when a new image is pushed.
images:
  - name: registry.gitlab.com/kubeantony/rust-log-generator
    digest: sha256:051cc21085bc9177b78198aae9df37f03a4bf8f8eae19f9924b433a52c8e96f4
