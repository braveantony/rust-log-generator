[package]
name = "rust-log-generator"
version = "0.1.2"
edition = "2021"
description = "Log generator with a configurable MiB/s rate and JSON or plain-text output"
license = "Apache-2.0"

[dependencies]
libc = "0.2"
signal-hook = "0.3"

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
